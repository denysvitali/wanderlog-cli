# Wanderlog CLI Configuration Example
# Copy this file to $XDG_CONFIG_HOME/wanderlog/config.yaml (usually ~/.config/wanderlog/config.yaml)

# Authentication configuration
#
# Prefer `wanderlog login`: the password is used only for that login request
# and is never persisted. Session credentials are stored in the native system
# keychain (macOS Keychain, Windows Credential Manager, or Linux Secret Service).
auth:
  # Email is optional metadata. To automate a login, provide the password only
  # through WANDERLOG_AUTH_PASSWORD; never put it in this file.
  email: ""

  # Legacy compatibility only. New logins keep session credentials in the
  # system keychain. If these fields are used, protect this file with mode 0600.
  session:
    cookie: ""
    xsrf_token: ""
    user_id: ""

# You can also set these via environment variables:
# WANDERLOG_AUTH_EMAIL
# WANDERLOG_AUTH_PASSWORD
# WANDERLOG_AUTH_SESSION_COOKIE
# WANDERLOG_AUTH_SESSION_XSRF_TOKEN
# WANDERLOG_AUTH_SESSION_USER_ID

# How it works:
# 1. Explicit session environment variables or flags are used when supplied.
# 2. Otherwise the CLI loads session credentials from the system keychain.
# 3. WANDERLOG_AUTH_EMAIL plus WANDERLOG_AUTH_PASSWORD can refresh a rejected
#    session without persisting the password.

# Priority order for credentials:
# 1. Command-line flags (--session, --xsrf)
# 2. Session tokens from environment variables (WANDERLOG_AUTH_SESSION_*)
# 3. Session tokens from config file (auth.session.*)
# 4. System keychain (stored via 'wanderlog login')
# 5. Environment-only email/password fallback for session refresh
